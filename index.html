<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BFDI Custom Night</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');
        body { margin: 0; background: #000; color: #fff; font-family: 'Vt323', monospace; overflow: hidden; user-select: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        
        /* Office layers */
        #office-layer { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; z-index: 1; }
        #jumpscare-overlay { position: absolute; width: 100%; height: 100%; z-index: 100; display: none; pointer-events: none; }
        #jumpscare-img { width: 100%; height: 100%; object-fit: contain; }

        /* UCN UI - Buttons are transparent with white outlines */
        .hud-btn { 
            position: absolute; background: transparent; border: 2px solid #fff; 
            color: #fff; font-family: 'Vt323'; cursor: pointer; z-index: 50; 
            padding: 8px; width: 180px; text-align: left;
        }
        #btn-heater { top: 20px; right: 20px; }
        #btn-musicbox { top: 80px; right: 20px; }
        #btn-light-left { top: 40%; left: 10px; width: 70px; height: 120px; text-align: center; }
        #btn-light-right { top: 40%; right: 10px; width: 70px; height: 120px; text-align: center; }
        #btn-monitor { bottom: 20px; left: 50%; transform: translateX(-50%); width: 300px; border-color: #0f0; color: #0f0; text-align: center; font-size: 1.5rem; }
        
        /* Monitor */
        #monitor-overlay { position: absolute; width: 100%; height: 100%; background: #000; z-index: 60; display: none; }
        #cam-feed { width: 100%; height: 100%; background-size: contain; background-repeat: no-repeat; background-position: center; }
        #map { position: absolute; bottom: 100px; right: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #0f0; }
        .cam-btn { border: 1px solid #0f0; color: #0f0; background: #000; cursor: pointer; }

        /* Jumpscare Animations */
        .oscillate { animation: shake 0.1s infinite; filter: blur(1px) contrast(1.2); transform: skewX(-5deg); }
        .td-slide { animation: slideLeft 0.5s ease-out forwards; }

        @keyframes shake { 
            0% { transform: translate(5px, 5px) skewX(-5deg); } 
            50% { transform: translate(-5px, -5px) rotate(2deg) skewX(-5deg); } 
            100% { transform: translate(2px, -2px) skewX(-5deg); } 
        }
        @keyframes slideLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }

        /* Menus */
        .full-screen { position: absolute; width: 100%; height: 100%; background: #000; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #cn-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="screen-load" class="full-screen">
        <h1>BFDI CUSTOM NIGHT</h1>
        <input type="file" id="zip-input" accept=".zip">
        <p>Please provide ZIP file to unlock "Start Night".</p>
    </div>

    <div id="screen-menu" class="full-screen" style="display:none;">
        <h1 style="color:#0f0">ULTIMATE CUSTOM NIGHT</h1>
        <div id="cn-grid"></div>
        <button onclick="startGame()" style="padding:15px 60px; font-size:2rem; cursor:pointer;">START NIGHT</button>
    </div>

    <div id="screen-retry" class="full-screen" style="display:none;">
        <h1 style="color:red; font-size:4rem;">GAME OVER</h1>
        <button onclick="showMenu()" style="padding:10px 40px; font-size:1.5rem;">RETRY</button>
    </div>

    <div id="office-layer"></div>
    <div id="jumpscare-overlay"><img id="jumpscare-img"></div>

    <div id="screen-game" style="display:none;">
        <div id="monitor-overlay">
            <div id="cam-feed"></div>
            <div id="map">
                <button class="cam-btn" onclick="setCam('CAM1')">L. HALL</button>
                <button class="cam-btn" onclick="setCam('CAM2')">R. HALL</button>
                <button class="cam-btn" onclick="setCam('CAM3')">CLOSET</button>
                <button class="cam-btn" onclick="setCam('CAM4')">P/S</button>
            </div>
        </div>
        <button id="btn-heater" class="hud-btn" onclick="toggleHeater()">HEATER</button>
        <button id="btn-musicbox" class="hud-btn" onmousedown="windBox(true)" onmouseup="windBox(false)">MUSIC BOX</button>
        <button id="btn-light-left" class="hud-btn" onmousedown="setL('L', true)" onmouseup="setL('L', false)">LIGHT L</button>
        <button id="btn-light-right" class="hud-btn" onmousedown="setL('R', true)" onmouseup="setL('R', false)">LIGHT R</button>
        <button id="btn-monitor" class="hud-btn" onclick="toggleMon()">MONITOR</button>
    </div>
</div>

<script>
    const CHARS = ['Marker','Flower','Leafy','Gelatin','Liy','Clock','Firey','Teardrop','Book','Profiley'];
    let loaded = {}, ai = {}, gameLoop, musicRef = null;
    let s = { 
        mon: false, heater: false, cam: 'CAM1', music: 1000, lightL: false, lightR: false,
        fStage: 0, fTimer: 0, clockTimer: 0, mStage: 0, mTimer: 0, 
        tdTimer: 0, tdGlitch: false, bookSeen: false, profActive: false, 
        winding: false, pTimer: 0, heaterTime: 0, rightLightTime: 0
    };

    document.getElementById('zip-input').onchange = async (e) => {
        const zip = new JSZip();
        const content = await zip.loadAsync(e.target.files[0]);
        for(let n in content.files) {
            loaded[n.toLowerCase()] = URL.createObjectURL(await content.files[n].async('blob'));
        }
        showMenu();
    };

    function showMenu() {
        document.querySelectorAll('.full-screen').forEach(scr => scr.style.display = 'none');
        document.getElementById('screen-menu').style.display = 'flex';
        document.getElementById('cn-grid').innerHTML = CHARS.map(c => `
            <div style="background:#111; padding:10px; border:1px solid #555;">
                ${c}<br><input type="number" id="ai-${c}" value="0" min="0" max="20" style="width:40px;">
            </div>
        `).join('');
    }

    function playSfx(n) { if(loaded[n.toLowerCase()]) return new Audio(loaded[n.toLowerCase()]).play(); }

    function setL(side, val) {
        playSfx('Mouse Click - Sound Effect (HD).mp3');
        if(side === 'L') s.lightL = val; else s.lightR = val;
        if(s.lightL && s.fStage === 2) { 
            updateOffice();
            setTimeout(() => triggerJumpscare('Firey'), 2000); 
        }
        updateOffice();
    }

    function toggleHeater() { s.heater = !s.heater; playSfx('Mouse Click - Sound Effect (HD).mp3'); }

    function windBox(val) {
        s.winding = val;
        if(val && !musicRef) {
            musicRef = new Audio(loaded['bfb ost - places (low quality  full version).mp3']);
            musicRef.loop = true; musicRef.play();
        } else if(!val && musicRef) { musicRef.pause(); musicRef = null; }
    }

    function toggleMon() {
        playSfx('Mouse Click - Sound Effect (HD).mp3');
        s.mon = !s.mon;
        if(s.mon) playSfx('RadioStatic.mp3');
        document.getElementById('monitor-overlay').style.display = s.mon ? 'block' : 'none';
        
        if(!s.mon && s.bookSeen) {
            if(s.rightLightTime < 3) triggerJumpscare('Book');
            else s.bookSeen = false;
        }
        updateCams();
    }

    function setCam(c) { s.cam = c; playSfx('Mouse Click - Sound Effect (HD).mp3'); updateCams(); }

    function startGame() {
        CHARS.forEach(c => ai[c] = parseInt(document.getElementById('ai-'+c).value));
        s = { mon:false, heater:false, cam:'CAM1', music:1000, lightL:false, lightR:false, fStage:0, fTimer:0, clockTimer:0, mStage:0, mTimer:0, tdTimer:0, tdGlitch:false, bookSeen:false, profActive:false, winding:false, pTimer:0, heaterTime:0, rightLightTime:0 };
        document.getElementById('screen-menu').style.display = 'none';
        document.getElementById('screen-game').style.display = 'block';
        updateOffice();
        gameLoop = setInterval(tick, 100);
    }

    function tick() {
        let diff = (Object.values(ai).every(v => v === 20)) ? 0.7 : 0.4;

        // 1. FIREY: CAM1 -> 30s -> Door -> 15s Stare
        if(s.fStage === 0 && Math.random() < (ai.Firey/20)*diff) s.fStage = 1;
        if(s.fStage === 1 && (s.fTimer += 0.1) >= 30) { s.fStage = 2; s.fTimer = 0; }
        if(s.fStage === 2) {
            s.fTimer += 0.1;
            if(s.fTimer >= 10 && !s.lightL) { s.fStage = 0; s.fTimer = 0; }
        }

        // 2. CLOCK: CAM4 -> 30s Reset
        if(!s.mon || s.cam !== 'CAM4') s.clockTimer += 0.1; else s.clockTimer = 0;
        if(s.clockTimer >= 30 && s.mon && s.cam === 'CAM4') {
            updateCams();
            setTimeout(() => triggerJumpscare('Clock'), 2000);
        }

        // 3. MARKER/GELATIN: Heater Defense
        if(s.mStage === 0 && Math.random() < (ai.Marker/20)*diff) s.mStage = 1;
        if(s.mStage === 1 && (s.mTimer += 0.1) >= 30) { s.mStage = 2; s.mTimer = 0; }
        if(s.mStage === 2) {
            if(s.heater) { s.heaterTime += 0.1; if(s.heaterTime >= 6) { s.mStage = 0; s.heaterTime = 0; } }
            else { s.mTimer += 0.1; if(s.mTimer > 15) triggerJumpscare('Marker'); }
        }

        // 4. TEARDROP: CAM1 Glitch
        if(s.mon && s.cam === 'CAM1' && Math.random() < 0.3) {
            s.tdTimer += 0.1;
            if(s.tdTimer >= 8) {
                s.tdGlitch = true; updateCams();
                setTimeout(() => { if(!s.heater) triggerJumpscare('Teardrop'); else { s.tdGlitch = false; s.tdTimer = 0; }}, 1000);
            }
        }

        // 5. LEAFY: Heater Defense
        if(Math.random() < (ai.Leafy/20)*0.8) {
            if(!s.heater) { s.lTimer = (s.lTimer||0)+0.1; if(s.lTimer > 10) triggerJumpscare('Leafy'); }
            else { s.lTimer = 0; }
        }

        // 6. FLOWER: Music Box
        if(s.winding) s.music = Math.min(1000, s.music + 20); else s.music -= (ai.Flower * 0.1);
        if(s.music <= 0 && Math.random() < 0.4) triggerJumpscare('Flower');

        // 7. PROFILEY: Cinematic Boom
        if(Math.random() < 0.001 && ai.Profiley > 0) {
            playSfx('CinematicBoom.mp3');
            setTimeout(() => { s.profActive = true; s.pTimer = 0; updateOffice(); }, 500);
        }
        if(s.profActive) {
            if(s.heater) { s.pTimer += 0.1; if(s.pTimer >= 3) { s.profActive = false; updateOffice(); } }
            else { s.pTimer += 0.1; if(s.pTimer > 5) triggerJumpscare('Profiley'); }
        }

        if(s.lightR && s.bookSeen) s.rightLightTime += 0.1;
    }

    function updateOffice() {
        let img = loaded['office.png'];
        if(s.profActive) img = loaded['profileyoffice.png'];
        else if(s.lightL) img = (s.fStage === 2) ? loaded['fireyleftwithlight.png'] : loaded['officeleftlight.png'];
        else if(s.lightR) img = (Math.random() < 0.4) ? loaded['liyinrighthallwindow.png'] : loaded['officerightlight.png'];
        document.getElementById('office-layer').style.backgroundImage = `url(${img})`;
    }

    function updateCams() {
        let img = '';
        if(s.cam === 'CAM1') {
            if(s.tdGlitch) img = loaded['teardroprun.png'];
            else if(s.fStage === 1) img = loaded['fireylefthall.png'];
            else if(Math.random() < 0.8) img = loaded['leafylefthall.png'];
            else img = loaded['lefthallempty.webp'];
        }
        if(s.cam === 'CAM2') img = (s.mStage === 2) ? loaded['markerrighthall.png'] : loaded['righthallempty.webp'];
        if(s.cam === 'CAM3') {
            if(Math.random() < 0.25) { img = loaded['booksupplycloset.png']; s.bookSeen = true; }
            else if(s.mStage === 1) img = loaded['supplyclosetmarker.png'];
            else img = loaded['supplyclosetempty.webp'];
        }
        if(s.cam === 'CAM4') img = (s.clockTimer >= 30) ? loaded['partsorservicegameover.webp'] : loaded['clockpartsorservice.png'];
        document.getElementById('cam-feed').style.backgroundImage = `url(${img})`;
    }

    function triggerJumpscare(who) {
        clearInterval(gameLoop);
        const sfx = ['Gelatin','Profiley','Marker'].includes(who) ? 'GelatinProfileyMarkerJumpscare.mp3' : 'LiyLeafyBookJumpscare.mp3';
        playSfx(sfx);
        const over = document.getElementById('jumpscare-overlay');
        const img = document.getElementById('jumpscare-img');
        img.src = loaded[who.toLowerCase() + 'jumpscare.png'];
        img.className = (who === 'Teardrop') ? 'td-slide oscillate' : 'oscillate';
        over.style.display = 'block';
        setTimeout(() => {
            over.style.display = 'none';
            document.getElementById('screen-game').style.display = 'none';
            document.getElementById('screen-retry').style.display = 'flex';
        }, 3000);
    }
</script>
</body>
</html>
